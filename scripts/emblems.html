<!doctype html>
<!--
  Source of the drawn card emblems in public/images/work/emblems/.
  Each tile is 800 x 600 (the 4:3 shape of a card panel): a line icon in a badge, the name, one
  factual line and, where the CV has one, the number. Nothing here imitates an organisation's logo.
  Render one tile with headless Chrome, for example:
    chrome --headless --window-size=800,600 --screenshot=out.png "file://.../emblems.html#shop"
  then convert to WebP (see docs/DESIGN.md section 32).
-->
<meta charset="utf-8" />
<title>Card emblems</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #14120f; --paper: #ece7e1; --muted: #a39a91; --accent: #ff7a1a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 800px; height: 600px; overflow: hidden; background: var(--ink); }
  body { font-family: "Anek Latin", "Helvetica Neue", Arial, sans-serif; color: var(--paper); }
  .tile { position: relative; display: none; width: 800px; height: 600px; padding: 56px 64px; overflow: hidden;
    background:
      radial-gradient(70% 60% at 100% 0%, rgb(255 122 26 / 0.16), transparent 70%),
      linear-gradient(rgb(255 255 255 / 0.045) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgb(255 255 255 / 0.045) 1px, transparent 1px) 0 0 / 40px 40px,
      #14120f; }
  .tile.on { display: block; }
  .badge { width: 204px; height: 204px; border-radius: 40px; border: 2px solid rgb(255 122 26 / 0.55);
    background: rgb(255 122 26 / 0.07); display: grid; place-items: center; }
  .badge svg { width: 128px; height: 128px; fill: none; stroke: var(--accent); stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
  .kicker { position: absolute; top: 64px; right: 64px; font-size: 22px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .copy { position: absolute; left: 64px; right: 64px; bottom: 52px; }
  .title { font-size: 52px; line-height: 1.06; font-weight: 600; letter-spacing: -0.01em; }
  .title.long { font-size: 44px; }
  .cap { margin-top: 14px; font-size: 28px; line-height: 1.3; color: var(--muted); }
  .stat { margin-top: 18px; }
  .stat b { display: block; font-size: 104px; line-height: 0.95; font-weight: 600; letter-spacing: -0.02em; color: var(--accent); }
  .stat span { display: block; margin-top: 8px; font-size: 28px; color: var(--muted); }
</style>
<body></body>
<script>
  // Icons are drawn on a 100 x 100 grid with one stroke style, so the set reads as one family.
  const I = {
    shop: '<path d="M12 38 L18 18 H82 L88 38 Z"/><path d="M12 38 q9.5 11 19 0 q9.5 11 19 0 q9.5 11 19 0 q9.5 11 19 0"/><path d="M18 48 V84 H82 V48"/><path d="M42 84 V62 H58 V84"/><rect x="64" y="58" width="12" height="12"/>',
    canteen: '<path d="M26 14 V36 M34 14 V36 M42 14 V36"/><path d="M26 36 q0 11 8 11 q8 0 8 -11"/><path d="M34 47 V86"/><path d="M62 14 C78 22 78 46 62 54 V86 M62 14 V54"/>',
    pulse: '<rect x="12" y="22" width="76" height="56" rx="8"/><path d="M20 52 H36 L43 34 L54 68 L61 52 H80"/>',
    path: '<path d="M20 78 C42 78 34 50 50 50 S62 26 76 26"/><circle cx="20" cy="78" r="5"/><circle cx="50" cy="50" r="5"/><path d="M78 26 V8 M78 8 L92 14 L78 20"/>',
    bars: '<path d="M12 86 H88"/><path d="M22 86 V66 M42 86 V54 M62 86 V42 M82 86 V28"/><path d="M14 52 L38 38 L56 46 L84 14 M70 14 H84 V28"/>',
    blocks: '<rect x="4" y="34" width="24" height="24" rx="3"/><rect x="38" y="34" width="24" height="24" rx="3"/><rect x="72" y="34" width="24" height="24" rx="3"/><path d="M28 46 H38 M62 46 H72"/><path d="M10 42 H22 M10 50 H18"/>',
    monitor: '<rect x="12" y="16" width="76" height="50" rx="5"/><path d="M50 66 V80 M32 84 H68"/><circle cx="50" cy="41" r="9"/><circle cx="50" cy="41" r="3"/><path d="M50 28 V32 M50 50 V54 M37 41 H41 M59 41 H63"/>',
    spot: '<rect x="26" y="10" width="48" height="22" rx="4"/><path d="M36 32 L16 86 M50 32 V86 M64 32 L84 86"/><path d="M38 21 H62"/>',
    people: '<circle cx="50" cy="40" r="11"/><path d="M30 86 C30 64 38 58 50 58 C62 58 70 64 70 86"/><circle cx="20" cy="50" r="8"/><path d="M6 84 C6 70 12 64 20 64"/><circle cx="80" cy="50" r="8"/><path d="M94 84 C94 70 88 64 80 64"/>',
    shield: '<path d="M50 8 L84 21 V48 C84 68 70 80 50 91 C30 80 16 68 16 48 V21 Z"/><circle cx="50" cy="44" r="8"/><path d="M50 52 V68"/>',
    board: '<rect x="10" y="14" width="80" height="52" rx="4"/><path d="M24 30 H66 M24 42 H52 M24 54 H60"/><path d="M30 66 L22 88 M70 66 L78 88"/>',
    bulb: '<path d="M50 8 C32 8 20 22 20 38 C20 50 28 56 33 64 V70 H67 V64 C72 56 80 50 80 38 C80 22 68 8 50 8 Z"/><path d="M38 82 H62 M43 92 H57"/><path d="M41 40 L50 50 L59 40"/>',
    briefcase: '<rect x="10" y="32" width="80" height="54" rx="7"/><path d="M36 32 V24 Q36 17 43 17 H57 Q64 17 64 24 V32"/><path d="M10 58 H90"/><rect x="44" y="53" width="12" height="10" rx="2"/>',
    book: '<path d="M50 24 C38 15 22 15 8 20 V80 C22 75 38 75 50 84 C62 75 78 75 92 80 V20 C78 15 62 15 50 24 Z"/><path d="M50 24 V84"/>',
    chat: '<path d="M10 14 H90 V62 H46 L28 80 V62 H10 Z"/><path d="M26 50 V42 M40 50 V34 M54 50 V38 M68 50 V26"/>',
  };
  // [id, icon, kicker, title, caption, stat, statLabel]
  const T = [
    ["shop", "shop", "Freelance project", "Shop Management System", "Full-stack web app for a client's shop"],
    ["canteen", "canteen", "Project", "CanteenGo", "College canteen pre-order system"],
    ["handoff", "pulse", "Hackathon prototype", "Clinical Handoff Risk Intelligence", "Offline decision support for shift handovers"],
    ["internpath", "path", "Personal project", "Internpath", "Internship guidance agent"],
    ["momentum", "bars", "Personal project", "Momentum Tracker", "Habits, streaks and a momentum score"],
    ["chain", "blocks", "Learning project", "Decentralized Blog", "A Clarity smart contract on Stacks"],
    ["technician", "monitor", "Internship", "Hardware and Software Technician", "New Technical World, Jalna"],
    ["kalavihangam", "spot", "Technical Coordinator", "Kalavihangam 2K23", "", "1,000+", "event attendees"],
    ["cyber", "shield", "Courses and workshops", "Cybersecurity and digital skills", "Security, forensics and digital marketing"],
    ["mscit", "board", "Part-time trainer", "MS-CIT Trainer", "", "25+", "students trained"],
    ["hacked", "bulb", "Session speaker", "Hackathon Hacked", "Technophilia 2K26, MIT CSN"],
    ["tnp", "briefcase", "President", "Training, Placement and Entrepreneurship Student Cell", "", "95+", "campus recruitment drives"],
    ["dfc", "book", "Sales and Marketing Intern", "Dnyandeep Foundation Centre", "", "125+", "qualified admission leads"],
    ["social", "chat", "Community and content", "Social media for the T&P cell and Athlete Meets Explorer", "", "25,000+", "monthly reach"],
    ["induction", "people", "Events", "Kalavihangam 2K23 and first-year induction", "", "250+", "first-year students inducted"],
  ];
  const root = document.body;
  for (const [id, icon, kicker, title, cap, stat, statLabel] of T) {
    const el = document.createElement("section");
    el.className = "tile"; el.id = id;
    el.innerHTML =
      `<div class="badge"><svg viewBox="0 0 100 100">${I[icon]}</svg></div>` +
      `<div class="kicker">${kicker}</div>` +
      `<div class="copy"><h1 class="title${title.length > 36 ? " long" : ""}">${title}</h1>` +
      (cap ? `<p class="cap">${cap}</p>` : "") +
      (stat ? `<div class="stat"><b>${stat}</b><span>${statLabel}</span></div>` : "") + `</div>`;
    root.append(el);
  }
  const want = location.hash.slice(1);
  (document.getElementById(want) || root.firstElementChild).classList.add("on");
</script>
